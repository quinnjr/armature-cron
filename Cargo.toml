[package]
name = "armature-cron"
version = "0.4.0"
edition = "2024"
rust-version = "1.94.1"
autobenches = false  # Disable auto-discovery, use explicit [[bench]] only
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-cron"
homepage = "https://quinnjr.github.io/armature"
description = "Scheduled task execution for Armature applications"
keywords = ["cron", "scheduler", "tasks", "background"]
categories = ["web-programming", "asynchronous"]

[dependencies]
# Logging
armature-log = { version = "0.2" }

# Core dependencies
async-trait = "0.1"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
chrono = "0.4"
cron = "0.17"

# DI integration
armature-core = { version = "0.9" }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "test-util"] }

# Explicit bench targets only: a stray file under benches/ should not silently
# become a target.
[[bench]]
name = "cron"
harness = false
